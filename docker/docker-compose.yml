services:
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    image: ai-medical-dept-backend:latest
    ports:
      - "${API_PORT:-8000}:8000"
    env_file:
      - ../.env
    restart: unless-stopped

  mcp_server:
    image: rimine/ai-medical-mcp:latest
    ports:
      - "8002:8000"
    restart: unless-stopped

  chat_service:
    image: rimine/ai-medical-chat-service:latest
    ports:
      - "8001:8000"
    env_file:
      - ../chat_service/.env
    environment:
      - MCP_SERVER_URL=http://mcp_server:8000/mcp
    restart: unless-stopped
    depends_on:
      - mcp_server
