version: "3.9"

services:
  serve:
    image: ai-medical-dept:serve
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ${CHECKPOINT_DIR}:/workspace/checkpoints:ro
      - ${FAISS_INDEX_PATH}:/workspace/faiss:ro
      - hf_cache:/workspace/.cache/huggingface
    env_file: .env
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

volumes:
  hf_cache:
